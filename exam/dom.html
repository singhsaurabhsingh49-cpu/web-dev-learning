
<!DOCTYPE html>
<html>
<body>

<h2 id="heading">Hello World</h2>
<p class="para">Welcome to JavaScript</p>

<button onclick="change()">Click Me</button>

<script>
function change() {
    document.getElementById("heading").innerHTML = "Hello Student";

    document.getElementsByClassName("para")[0].innerHTML = "DOM Changed!";
}
</script>

</body>
</html>
