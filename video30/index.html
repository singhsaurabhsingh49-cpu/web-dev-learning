<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS variable</title>
    <style>
        :root{
            --color:blue;
            --seccolor:rgb(174,174, 222);
            --defpad:23px;
            --defop:0.4;
        }
        *{
            margin: 0;
            padding: 0;
        }
        ul{
            display:flex;
        }
        ul li{
            opacity:var(--defop);
            list-style:none;
            padding:var(--defpad);
            border:5px solid var(--seccolor)
        }
        ul li:first-child{
             --color:rgb(0, 255, 145);
              background-color:var(--color);
        }
       .nav{
        background-color:var(--color);
       }
       .container{
        background-color:var(--seccolor);
       }
    </style>
</head>
<body>
    <div class="nav">
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Contact</li>
        </ul>
    </div>
    <div class="container">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Praesentium inventore fugit, dignissimos eius aliquam placeat nisi ipsum, corrupti dolorem, dolor est minus. Vel reprehenderit unde sit, rem ad earum. Quis, excepturi saepe.
    </div>
</body>
</html>
